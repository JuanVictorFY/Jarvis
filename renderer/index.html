<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
  <title>Jarvis</title>
</head>
<body>

<!-- ── Settings overlay ──────────────────────────────────────────────────── -->
<div id="settings-overlay">
  <div id="settings-panel">
    <h2>⚙ Settings</h2>

    <div class="settings-section-title">Anthropic (Claude)</div>
    <div class="field">
      <label>API Key</label>
      <input type="password" id="cfg-key" placeholder="sk-ant-..." autocomplete="off" />
    </div>
    <div class="field">
      <label>Model</label>
      <select id="cfg-model">
        <option value="claude-sonnet-4-6">Claude Sonnet 4.6 (Recommended)</option>
        <option value="claude-opus-4-8">Claude Opus 4.8 (Most capable)</option>
        <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5 (Fastest)</option>
      </select>
    </div>
    <div class="field">
      <label>Max Tokens per response</label>
      <input type="number" id="cfg-tokens" min="1024" max="32000" step="1024" />
    </div>

    <div class="settings-section-title">OpenAI</div>
    <div class="field">
      <label>API Key</label>
      <input type="password" id="cfg-openai-key" placeholder="sk-..." autocomplete="off" />
    </div>

    <div class="settings-section-title">Google Gemini</div>
    <div class="field">
      <label>API Key</label>
      <input type="password" id="cfg-gemini-key" placeholder="AIza..." autocomplete="off" />
    </div>

    <div class="settings-section-title">Ollama (local)</div>
    <div class="field">
      <label>Base URL</label>
      <input type="text" id="cfg-ollama-url" placeholder="http://localhost:11434" />
    </div>

    <div class="settings-section-title">General</div>
    <div class="field">
      <label>Default Provider</label>
      <select id="cfg-provider">
        <option value="anthropic">Anthropic (Claude)</option>
        <option value="openai">OpenAI</option>
        <option value="gemini">Google Gemini</option>
        <option value="ollama">Ollama (local)</option>
      </select>
    </div>
    <div class="field">
      <label>Theme</label>
      <select id="cfg-theme">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
        <option value="solarized">Solarized</option>
        <option value="nord">Nord</option>
        <option value="dracula">Dracula</option>
      </select>
    </div>

    <div class="settings-actions">
      <button class="btn btn-secondary" id="btn-settings-cancel">Cancel</button>
      <button class="btn btn-primary"   id="btn-settings-save">Save</button>
    </div>
  </div>
</div>

<!-- ── Header ─────────────────────────────────────────────────────────────── -->
<div id="header">
  <span class="logo">⚡ Jarvis</span>
  <div id="token-stats" title="Session token usage">
    <span class="stat-label">in</span><span id="stat-in">0</span>
    <span class="stat-sep">·</span>
    <span class="stat-label">out</span><span id="stat-out">0</span>
  </div>
  <div class="header-btns">
    <button class="btn-icon" id="btn-clear"        title="Clear conversation">↺</button>
    <button class="btn-icon" id="btn-settings-open" title="Settings">⚙</button>
  </div>
</div>

<!-- ── Messages ───────────────────────────────────────────────────────────── -->
<div id="messages" role="log" aria-live="polite"></div>

<!-- ── Input ──────────────────────────────────────────────────────────────── -->
<div id="input-area">
  <div id="input-row">
    <textarea id="user-input"
      placeholder="Ask Jarvis anything — read files, browse the web, run commands…"
      rows="1"
      aria-label="Message"></textarea>
    <button class="btn btn-primary" id="btn-send">Send ↵</button>
  </div>
  <div id="hint">Enter = send · Shift+Enter = newline · Ctrl+Shift+J = toggle window</div>
</div>

<!-- ── Toast container (injected by app.js) ──────────────────────────────── -->
<div id="toast-container"></div>

<script src="app.js"></script>
</body>
</html>
