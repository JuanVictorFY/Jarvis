<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline';" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
  <title>Jarvis</title>
</head>
<body>

<!-- ── Settings overlay ──────────────────────────────────────────────────── -->
<div id="settings-overlay">
  <div id="settings-panel">
    <h2>⚙ Settings</h2>

    <div class="field">
      <label>Anthropic API Key</label>
      <input type="password" id="cfg-key" placeholder="sk-ant-..." autocomplete="off" />
    </div>

    <div class="field">
      <label>Model</label>
      <select id="cfg-model">
        <option value="claude-sonnet-4-6">Claude Sonnet 4.6 (Recommended)</option>
        <option value="claude-opus-4-8">Claude Opus 4.8 (Most capable)</option>
        <option value="claude-haiku-4-5-20251001">Claude Haiku 4.5 (Fastest)</option>
      </select>
    </div>

    <div class="field">
      <label>Max Tokens per response</label>
      <input type="number" id="cfg-tokens" min="1024" max="32000" step="1024" />
    </div>

    <div class="settings-actions">
      <button class="btn btn-secondary" id="btn-settings-cancel">Cancel</button>
      <button class="btn btn-primary" id="btn-settings-save">Save</button>
    </div>
  </div>
</div>

<!-- ── Header ─────────────────────────────────────────────────────────────── -->
<div id="header">
  <span class="logo">⚡ Jarvis</span>
  <div class="header-btns">
    <button class="btn-icon" id="btn-clear" title="Clear conversation">↺</button>
    <button class="btn-icon" id="btn-settings-open" title="Settings">⚙</button>
  </div>
</div>

<!-- ── Messages ───────────────────────────────────────────────────────────── -->
<div id="messages" role="log" aria-live="polite"></div>

<!-- ── Input ──────────────────────────────────────────────────────────────── -->
<div id="input-area">
  <div id="input-row">
    <textarea id="user-input"
      placeholder="Ask Jarvis anything — read files, browse the web, run commands…"
      rows="1"
      aria-label="Message"></textarea>
    <button class="btn btn-primary" id="btn-send">Send ↵</button>
  </div>
  <div id="hint">Enter = send · Shift+Enter = newline · Ctrl+Shift+J = toggle window</div>
</div>

<script>
// ── Type declarations for window.jarvis (from preload) ─────────────────────
/** @type {any} */
const jarvis = window.jarvis;

// ── Code registry (id → {code, lang}) ─────────────────────────────────────
/** @type {Map<number,{code:string,lang:string}>} */
const codeReg = new Map();
let codeId = 0;

// ── DOM refs ───────────────────────────────────────────────────────────────
const messagesEl    = /** @type {HTMLElement} */ (document.getElementById('messages'));
const inputEl       = /** @type {HTMLTextAreaElement} */ (document.getElementById('user-input'));
const sendBtn       = /** @type {HTMLButtonElement} */ (document.getElementById('btn-send'));
const clearBtn      = document.getElementById('btn-clear');
const settingsOpen  = document.getElementById('btn-settings-open');
const settingsOvl   = document.getElementById('settings-overlay');
const settingsCancel= document.getElementById('btn-settings-cancel');
const settingsSave  = document.getElementById('btn-settings-save');
const cfgKey        = /** @type {HTMLInputElement} */ (document.getElementById('cfg-key'));
const cfgModel      = /** @type {HTMLSelectElement} */ (document.getElementById('cfg-model'));
const cfgTokens     = /** @type {HTMLInputElement} */ (document.getElementById('cfg-tokens'));

// ── Streaming state ────────────────────────────────────────────────────────
let streaming = false;
let streamText = '';
/** @type {HTMLElement|null} */
let streamBubble = null;

// ── Tool cards map: tool_use id → card element ─────────────────────────────
/** @type {Map<string, HTMLElement>} */
const toolCards = new Map();

// ── Input auto-resize ──────────────────────────────────────────────────────
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 130) + 'px';
});

inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});

sendBtn.addEventListener('click', sendMessage);

clearBtn?.addEventListener('click', () => {
  jarvis.clearHistory();
  messagesEl.innerHTML = '';
  codeReg.clear(); codeId = 0;
  toolCards.clear();
});

// ── Settings ───────────────────────────────────────────────────────────────
settingsOpen?.addEventListener('click', openSettings);
settingsCancel?.addEventListener('click', () => { settingsOvl?.classList.remove('visible'); });

settingsSave?.addEventListener('click', async () => {
  await jarvis.saveConfig({
    anthropicApiKey: cfgKey.value.trim(),
    model: cfgModel.value,
    maxTokens: parseInt(cfgTokens.value, 10) || 8192,
  });
  settingsOvl?.classList.remove('visible');
});

async function openSettings() {
  const cfg = await jarvis.getConfig();
  cfgKey.value = cfg.anthropicApiKey ?? '';
  cfgModel.value = cfg.model ?? 'claude-sonnet-4-6';
  cfgTokens.value = String(cfg.maxTokens ?? 8192);
  settingsOvl?.classList.add('visible');
}

jarvis.onOpenSettings((cfg) => {
  cfgKey.value = cfg.anthropicApiKey ?? '';
  cfgModel.value = cfg.model ?? 'claude-sonnet-4-6';
  cfgTokens.value = String(cfg.maxTokens ?? 8192);
  settingsOvl?.classList.add('visible');
});

// ── Code block button delegation ───────────────────────────────────────────
messagesEl.addEventListener('click', e => {
  const btn = /** @type {HTMLElement|null} */
    (e.target instanceof Element ? e.target.closest('[data-action]') : null);
  if (!btn) return;

  // Toggle tool card
  const toggle = /** @type {HTMLElement|null} */
    (e.target instanceof Element ? e.target.closest('.tool-header') : null);
  if (toggle?.closest('.tool-card')) {
    toggle.closest('.tool-card')?.classList.toggle('expanded');
    return;
  }

  const action = btn.dataset.action;
  const id = parseInt(btn.dataset.id ?? '0', 10);
  const entry = codeReg.get(id);
  if (!entry) return;

  if (action === 'copy') {
    navigator.clipboard.writeText(entry.code).catch(() => {});
    const orig = btn.textContent;
    btn.textContent = '✓ Copied';
    setTimeout(() => { btn.textContent = orig; }, 1400);
  } else if (action === 'apply') {
    // Open file, write via jarvis tool (no editor here — just copy)
    navigator.clipboard.writeText(entry.code).catch(() => {});
  } else if (action === 'run') {
    // Trigger send-message with a run request so Claude executes with confirmation
    const msg = `Please run this command:\n\`\`\`bash\n${entry.code.trim()}\n\`\`\``;
    inputEl.value = msg;
    sendMessage();
  } else if (action === 'confirm-ok') {
    const confirmId = btn.dataset.confirmId ?? '';
    resolveConfirm(confirmId, true, btn.closest('.confirm-card'));
  } else if (action === 'confirm-deny') {
    const confirmId = btn.dataset.confirmId ?? '';
    resolveConfirm(confirmId, false, btn.closest('.confirm-card'));
  }
});

/** @param {string} id @param {boolean} ok @param {Element|null} card */
function resolveConfirm(id, ok, card) {
  jarvis.confirmAction(id, ok);
  if (card) {
    card.innerHTML = `<span style="color:${ok ? '#50c050' : '#e05050'};font-size:12px">
      ${ok ? '✓ Allowed' : '✗ Denied'}</span>`;
  }
}

// ── Send ───────────────────────────────────────────────────────────────────
async function sendMessage() {
  const text = inputEl.value.trim();
  if (!text || streaming) return;

  appendMsg('user', text);
  inputEl.value = '';
  inputEl.style.height = 'auto';

  setStreaming(true);
  streamText = '';
  streamBubble = createBubble('assistant');
  streamBubble.classList.add('streaming');

  try {
    await jarvis.sendMessage(text);
  } catch (err) {
    appendMsg('error', '⚠ ' + String(err));
    setStreaming(false);
  }
}

// ── Agent events ───────────────────────────────────────────────────────────
jarvis.onAgentEvent(ev => {
  switch (ev.type) {

    case 'text':
      streamText += ev.text;
      if (streamBubble) streamBubble.textContent = streamText;
      scrollBottom();
      break;

    case 'text_done':
      if (streamBubble && streamText) {
        streamBubble.innerHTML = renderMarkdown(streamText);
        streamText = '';
        scrollBottom();
      }
      break;

    case 'tool_start': {
      // Create a new assistant bubble container if not already open
      ensureAssistantBubble();
      const card = buildToolCard(ev.id, ev.name, ev.summary, 'running');
      streamBubble?.appendChild(card);
      toolCards.set(ev.id, card);
      scrollBottom();
      break;
    }

    case 'tool_done': {
      const card = toolCards.get(ev.id);
      if (card) {
        const status = card.querySelector('.tool-status');
        if (status) {
          status.textContent = ev.isError ? '✗ error' : '✓ done';
          status.className = 'tool-status ' + (ev.isError ? 'error' : 'done');
        }
        const body = card.querySelector('.tool-result-body');
        if (body) body.textContent = ev.result;
      }
      scrollBottom();
      break;
    }

    case 'confirm': {
      ensureAssistantBubble();
      const confirmCard = buildConfirmCard(ev.id, ev.action, ev.detail);
      streamBubble?.appendChild(confirmCard);
      setStreaming(true); // keep input locked
      scrollBottom();
      break;
    }

    case 'done':
      finalizeAssistantBubble();
      setStreaming(false);
      inputEl.focus();
      break;

    case 'error':
      finalizeAssistantBubble();
      appendMsg('error', '⚠ ' + ev.message);
      setStreaming(false);
      break;
  }
});

// ── Helpers ────────────────────────────────────────────────────────────────
function ensureAssistantBubble() {
  if (!streamBubble) {
    streamBubble = createBubble('assistant');
  }
}

function finalizeAssistantBubble() {
  if (streamBubble) {
    streamBubble.classList.remove('streaming');
    // If there's leftover plain text, render it
    if (streamText) {
      // append rendered text
      const span = document.createElement('div');
      span.innerHTML = renderMarkdown(streamText);
      streamBubble.appendChild(span);
      streamText = '';
    }
    streamBubble = null;
  }
}

/** @param {'user'|'assistant'|'error'} role */
function createBubble(role) {
  const el = document.createElement('div');
  el.className = `msg ${role}`;
  messagesEl.appendChild(el);
  scrollBottom();
  return el;
}

/** @param {'user'|'assistant'|'error'} role @param {string} text */
function appendMsg(role, text) {
  const el = createBubble(role);
  el.textContent = text;
  return el;
}

function scrollBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

/** @param {boolean} v */
function setStreaming(v) {
  streaming = v;
  sendBtn.disabled = v;
  inputEl.disabled = v;
}

/**
 * @param {string} id
 * @param {string} name
 * @param {string} summary
 * @param {'running'|'done'|'error'} status
 */
function buildToolCard(id, name, summary, status) {
  const card = document.createElement('div');
  card.className = 'tool-card';
  card.innerHTML = `
    <div class="tool-header">
      <span class="tool-icon">🔧</span>
      <span class="tool-name">${escHtml(name)}</span>
      <span class="tool-summary">${escHtml(summary)}</span>
      <span class="tool-status ${status}">${status === 'running' ? '⟳ running' : ''}</span>
    </div>
    <div class="tool-result-body"></div>`;
  // Toggle expand on click
  card.querySelector('.tool-header')?.addEventListener('click', () => {
    card.classList.toggle('expanded');
  });
  return card;
}

/**
 * @param {string} id
 * @param {string} action
 * @param {string} detail
 */
function buildConfirmCard(id, action, detail) {
  const card = document.createElement('div');
  card.className = 'confirm-card';
  card.innerHTML = `
    <div class="confirm-title">⚠ Jarvis wants to: ${escHtml(action)}</div>
    <div class="confirm-detail">${escHtml(detail)}</div>
    <div class="confirm-btns">
      <button class="btn btn-primary btn-small" data-action="confirm-ok" data-confirm-id="${escHtml(id)}">✓ Allow</button>
      <button class="btn btn-danger btn-small" data-action="confirm-deny" data-confirm-id="${escHtml(id)}">✗ Deny</button>
    </div>`;
  return card;
}

// ── Markdown renderer ──────────────────────────────────────────────────────
const SHELL_LANGS = new Set(['bash','shell','sh','zsh','powershell','ps1','cmd','bat']);

/** @param {string} text */
function renderMarkdown(text) {
  const parts = text.split(/(```[\w-]*\n[\s\S]*?```)/g);
  return parts.map(part => {
    const m = part.match(/^```([\w-]*)\n([\s\S]*?)```$/);
    if (m) {
      const lang = (m[1] ?? '').toLowerCase();
      const code = (m[2] ?? '').replace(/\n$/, '');
      const id = ++codeId;
      codeReg.set(id, { code, lang: lang || 'text' });
      const isShell = SHELL_LANGS.has(lang);
      const actionBtn = isShell
        ? `<button class="btn btn-small btn-secondary code-btn" data-action="run" data-id="${id}">▶ Run</button>`
        : `<button class="btn btn-small btn-secondary code-btn" data-action="copy" data-id="${id}">Copy</button>`;
      return `<div class="code-block">`
        + `<div class="code-header"><span class="lang-label">${escHtml(lang||'text')}</span>`
        + `<div class="code-btns">`
        + `<button class="btn btn-small btn-secondary code-btn" data-action="copy" data-id="${id}">Copy</button>`
        + actionBtn
        + `</div></div><pre><code>${escHtml(code)}</code></pre></div>`;
    }
    return escHtml(part)
      .replace(/`([^`\n]+)`/g, (_, c) => `<code class="inline">${c}</code>`)
      .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\n/g, '<br>');
  }).join('');
}

/** @param {string} s */
function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Init ───────────────────────────────────────────────────────────────────
inputEl.focus();

// Show settings on first launch if no API key
jarvis.getConfig().then(cfg => {
  if (!cfg.anthropicApiKey) openSettings();
});
</script>
</body>
</html>
